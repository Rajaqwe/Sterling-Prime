name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Center gifting brief heading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          old = '<section class="cta brief" id="brief"><h2 class="rv">Plan your gifting in 30 seconds</h2>'
          new = '<section class="cta brief" id="brief"><h2 class="rv" style="text-align:center;margin-inline:auto">Plan your gifting in 30 seconds</h2>'
          if old not in html:
              raise SystemExit("Gifting brief heading not found; refusing to deploy without the centering fix.")
          html = html.replace(old, new, 1)
          style = """\n<style id="brief-form-centered">\n#bf{min-height:205px;align-content:center;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),220px));justify-content:center}\n#bf .btn{grid-column:1/-1;justify-self:center}\n@media(max-width:520px){#bf{grid-template-columns:minmax(0,1fr)}}\n</style>\n"""
          if 'id="brief-form-centered"' not in html:
              if "</head>" not in html:
                  raise SystemExit("Head closing tag missing; refusing to apply form centering.")
              html = html.replace("</head>", style + "</head>", 1)
          path.write_text(html, encoding="utf-8")
          PY

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sterling-prime-live
